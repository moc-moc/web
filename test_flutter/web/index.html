<!DOCTYPE html>
<html>
<head>
  <!-- 開発環境での認証チェック -->
  <script>
    // 開発環境でのみ認証チェックを実行
    // 本番環境ではこのチェックを無効化する
    const isDevelopment = true; // 本番時は false に変更してください
    
    if (isDevelopment) {
      // 認証チェックページ自身の場合はスキップ
      if (!window.location.pathname.includes('auth-check.html')) {
        // セッションストレージの認証フラグをチェック
        if (sessionStorage.getItem('dev_authenticated') !== 'true') {
          // 認証されていない場合は認証ページにリダイレクト
          window.location.href = '/auth-check.html';
        }
      }
    }
  </script>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">

<!-- Google Sign-In -->
<meta name="google-signin-client_id" content="658668060147-rf2r75ns0qdj2h2sd5176nsaj64asksc.apps.googleusercontent.com">
